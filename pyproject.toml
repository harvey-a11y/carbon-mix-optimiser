[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonmix"
version = "0.1.0"
description = "Low-carbon concrete mix screening tool: rank feasible mixes by embodied carbon (not a substitute for BS 8500 / EN 206 mix design)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harvey Sohal", email = "harvey@sohal.info" }]
keywords = ["concrete", "embodied-carbon", "ggbs", "fly-ash", "civil-engineering", "screening"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff"]

[project.scripts]
carbonmix = "carbonmix.cli:main"

[tool.setuptools.packages.find]
include = ["carbonmix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
